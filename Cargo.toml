[package]
name = "paclens"
version = "0.3.3"
edition = "2024"
description = "A TUI-first pacman + AUR + Flatpak inspection and update tool for Arch Linux. Installs a binary; there is no library API."
license = "MIT"
repository = "https://github.com/plasmaDestroyer/paclens"
readme = "README.md"
keywords = ["arch-linux", "pacman", "aur", "flatpak", "tui"]
categories = ["command-line-utilities", "os::linux-apis"]
# The published crate carries what is needed to build and to *test* the build.
# `tests/fixtures/` stays: the unit tests in `src/**` pull it in through
# `include_str!()`, so dropping it would make `cargo test` fail on the crate
# people actually download. What goes is what only makes sense from a git
# checkout — CI config and the AUR PKGBUILD, which builds from a git tag.
exclude = [".github/", "packaging/"]

# `cargo install paclens` compiles from source, which for this crate means a
# fat-LTO release build and a Rust toolchain. `cargo binstall paclens` fetches
# the release tarball that .github/workflows/release.yml already builds, so the
# fast path costs nothing beyond pointing at an artifact that exists anyway.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
petgraph = "0.8.3"
portable-pty = "0.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vt100 = "0.16.2"

# Release builds are what users install, so they optimize for a small, fast
# single binary rather than for build time. `strip` is the biggest single win
# — a default release build ships its symbol table.
#
# `panic = "abort"` is deliberately NOT set: it would shave a little more, but
# the TUI holds a live pty child, and aborting instead of unwinding out of
# portable-pty while that child is running is a worse failure than the bytes
# are worth. ratatui's panic hook restores the terminal either way.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
