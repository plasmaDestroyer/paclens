[package]
name = "paclens"
version = "0.3.0"
edition = "2024"
description = "A TUI-first pacman + AUR + Flatpak inspection and update tool for Arch Linux."
license = "MIT"
repository = "https://github.com/plasmaDestroyer/paclens"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
petgraph = "0.8.3"
portable-pty = "0.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vt100 = "0.16.2"

# Release builds are what users install, so they optimize for a small, fast
# single binary rather than for build time. `strip` is the biggest single win
# — a default release build ships its symbol table.
#
# `panic = "abort"` is deliberately NOT set: it would shave a little more, but
# the TUI holds a live pty child, and aborting instead of unwinding out of
# portable-pty while that child is running is a worse failure than the bytes
# are worth. ratatui's panic hook restores the terminal either way.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
